apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: todo-backend-ingress
  namespace: todo-app
  
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: api.anihub.shop
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: todo-backend-service
                port:
                  number: 8000